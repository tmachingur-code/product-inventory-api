services:
  db:
    image: postgres:18-alpine
    container_name: product-inventory-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: product_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d product_inventory"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-inventory-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/product_inventory
      JWT_SECRET: change-this-in-production

    ports:
      - "3000:3000"

volumes:
  postgres_data: